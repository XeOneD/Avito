name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Без sentence-transformers: тесты работают без плотного поиска.
      - run: pip install numpy pandas pyarrow scipy scikit-learn joblib lightgbm nltk -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -v
